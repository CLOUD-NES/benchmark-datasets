name: dev

on:
  push:
    paths:
      - 'scripts/**'
      - 'datasets/**'
      - 'justfile'
      - 'lib.just'
      - 'ruff.toml'
      - 'pixi.toml'
      - 'pixi.lock'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          environments: dev
          cache: true
      - run: pixi run -e dev lint
