[project]
authors = [{name = "Francesco Nattino", email = "f.nattino@esciencecenter.nl"}]
dependencies = [
    "s3fs>=2026.9.0,<2027",
    "obstore>=0.12.1,<0.13",
    "rustac>=0.9.19,<0.10",
    "xarray>=2026.9.0,<2027",
    "zarr>=3.4.2,<4",
    "virtualizarr>=2.8.0,<3",
    "kerchunk>=0.2.10,<0.3",
    "fastparquet>=2026.9.0,<2027",
    "icechunk>=2.4.0,<3",
    "virtual-tiff>=0.5.0,<0.6",
    "obspec-utils>=0.9.0,<0.10",
    "geozarr-toolkit>=0.1.2,<0.2",
    "click>=8.5.1,<9",
    "rioxarray",
    "dask",
]
name = "benchmark-datasets"
requires-python = ">= 3.11"
version = "0.1.0"

[project.scripts]
bench-data = "benchmark_datasets.cli:cli"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
benchmark_datasets = { path = ".", editable = true }

[tool.pixi.tasks]
just = "just --justfile just/justfile"

[tool.pixi.feature.dev.dependencies]
ruff = ">=0.17.6,<0.18"
pytest = ">=9.2.0,<10"
ty = ">=0.0.112,<0.0.113"

[tool.pixi.feature.dev.tasks]
test = "pytest"
ty = "ty check"
lint-py = "ruff check src tests && ruff format --check src tests"
lint-just = "just --justfile just/justfile --list --list-submodules"
lint = { depends-on = ["lint-py", "lint-just"] }

[tool.pixi.environments]
dev = ["dev"]

[tool.pixi.dependencies]
just = ">=1.59.0,<2"
gdal = ">=3.13.3,<4"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "D",  # pydocstyle
    "E",  # pycodestyle
    "W",
    "F",  # Pyflakes
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",  # isort
]
ignore = ["D100", "D103", "D203", "D213", "D413"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = [
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
]

[tool.ruff.lint.isort]
known-first-party = ["benchmark_datasets"]

[tool.ty]
src.include = ["./src"]
